name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/allandecastro/headroom/blob/main/CHANGELOG.md) for the human-written release notes.

            **Downloads:**
            - macOS (Apple Silicon): `Headroom_*_aarch64.dmg`
            - Windows: `Headroom_*_x64_en-US.msi`
            - Linux AppImage: `Headroom_*_amd64.AppImage`
            - Linux Debian: `headroom_*_amd64.deb`

  build:
    name: Build ${{ matrix.platform.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm, os: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf

      - run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required for tauri-plugin-updater to accept the
          # downloaded artifact. Generate with `tauri signer generate`; the
          # public key lives in tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Add the following for signed macOS builds (Phase 5):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.platform.target }}

  updater-manifest:
    name: Assemble latest.json
    # The build matrix runs one job per OS, and each emits its own `latest.json`
    # that overwrites the others on upload — so the published manifest would only
    # ever describe the last platform to finish. Rebuild a single merged manifest
    # from the signed artifacts once every platform is done. macOS is omitted on
    # purpose (notarized signing deferred — that build falls back to the browser).
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const byName = new Map(assets.map((a) => [a.name, a]));

            // Map an updater artifact filename to its latest.json platform key.
            function platformKey(name) {
              if (/\.msi$/i.test(name) || /\.exe$/i.test(name)) return 'windows-x86_64';
              if (/\.AppImage$/i.test(name)) return 'linux-x86_64';
              return null; // .app.tar.gz (macOS), .deb, etc. — no self-update
            }

            const platforms = {};
            for (const asset of assets) {
              if (!asset.name.endsWith('.sig')) continue;
              const base = byName.get(asset.name.slice(0, -4));
              if (!base) continue;
              const key = platformKey(base.name);
              if (!key) continue;

              const sig = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              // Build the URL from the tag, NOT `base.browser_download_url`:
              // at this point the release is still a draft, so the API returns a
              // `…/download/untagged-<hash>/…` URL that 404s once published.
              platforms[key] = {
                signature: Buffer.from(sig.data).toString('utf8').trim(),
                url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${encodeURIComponent(base.name)}`,
              };
            }

            if (Object.keys(platforms).length === 0) {
              throw new Error('No updater artifacts (.sig) found — cannot build latest.json');
            }

            const manifest = {
              version,
              notes: `See https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };

            // Replace the per-platform latest.json files left by the matrix jobs.
            const existing = assets.find((a) => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
            });
            core.info(`latest.json written for: ${Object.keys(platforms).join(', ')}`);

  publish:
    name: Publish release
    # Needs `create-release` too, otherwise `needs.create-release.outputs.release_id`
    # renders as empty in the script body and the github-script step crashes with
    # `SyntaxError: Unexpected token ','` (seen on the v1.0.0 tag).
    needs: [create-release, build, updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })

  update-tap:
    name: Update Homebrew tap
    # Runs after the release is public so the DMG is reachable at its stable
    # download URL. Regenerates the cask (version + sha256) from the published
    # aarch64 DMG and pushes it to the allandecastro/homebrew-headroom tap, so
    # `brew install --cask allandecastro/headroom/headroom` always tracks the
    # latest release with no manual step. Skips cleanly if the cross-repo PAT
    # secret isn't configured, so it never blocks a release.
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute DMG sha256
        id: dmg
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Headroom_${version}_aarch64.dmg"
          echo "Downloading $url"
          curl -fSL -o headroom.dmg "$url"
          sha="$(sha256sum headroom.dmg | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$version sha256=$sha"

      - name: Render cask from template
        run: |
          sed -i -E "s/^  version \".*\"/  version \"${{ steps.dmg.outputs.version }}\"/" homebrew/Casks/headroom.rb
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${{ steps.dmg.outputs.sha256 }}\"/" homebrew/Casks/headroom.rb
          echo '--- rendered cask ---'
          cat homebrew/Casks/headroom.rb

      - name: Push to tap repo
        env:
          # Classic PAT with `repo` scope (or fine-grained with Contents:write on
          # the tap repo). The built-in GITHUB_TOKEN can't push to another repo.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set — skipping tap update."
            echo "Add a PAT with 'repo' scope as the TAP_GITHUB_TOKEN secret to auto-publish the cask."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/allandecastro/homebrew-headroom.git" tap
          mkdir -p tap/Casks
          cp homebrew/Casks/headroom.rb tap/Casks/headroom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date — nothing to push."
            exit 0
          fi
          git add Casks/headroom.rb
          git commit -m "headroom ${{ steps.dmg.outputs.version }}"
          git push
          echo "Pushed headroom ${{ steps.dmg.outputs.version }} to the tap."
