name: "✨ Feature request"
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [FAQ § Scope](https://github.com/allandecastro/headroom/blob/main/FAQ.md#scope) — a few things are explicitly out of scope (CLI, "bring your own API" generic source, web sync, team rollups) and won't be considered.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What pain are you trying to solve? What's currently impossible, awkward, or annoying?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: How should Headroom address it? Be concrete — UI changes, new IPC commands, new source adapter, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're worse.

  - type: dropdown
    id: scope
    attributes:
      label: Does this fit Headroom's scope?
      description: See ROADMAP's "Explicit non-goals" section before answering.
      options:
        - Yes — extends existing functionality
        - Yes — adds a new AI service source (Cursor / Codex / Gemini / Perplexity / …)
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/allandecastro/headroom/issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I read [FAQ § Scope](https://github.com/allandecastro/headroom/blob/main/FAQ.md#scope) and this isn't explicitly excluded.
          required: true
