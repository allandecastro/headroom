name: "🐛 Bug report"
description: Something isn't working right.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please check the [FAQ](https://github.com/allandecastro/headroom/blob/main/FAQ.md) first — common issues (tray icon hidden, "Couldn't fetch usage", notifications attributed to the wrong app, sparkline "collecting…") are covered there.

  - type: input
    id: version
    attributes:
      label: Headroom version
      description: "From Settings → About, or the file name of the installer you ran."
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Service affected
      options:
        - Claude
        - GitHub Copilot
        - Both
        - Neither (tray / popover / settings / onboarding)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: |
        Run from a terminal with `RUST_LOG=headroom=debug,warn` to see debug logs.
        **Remove any tokens, cookies, or session keys before pasting.**
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag & drop here — especially helpful for UI / popover / tray issues.

  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/allandecastro/headroom/issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I read the [FAQ](https://github.com/allandecastro/headroom/blob/main/FAQ.md) and this isn't already answered.
          required: true
        - label: I removed any secrets (tokens, cookies, session keys) from logs / screenshots.
          required: true
