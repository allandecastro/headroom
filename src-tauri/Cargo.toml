[package]
name = "headroom"
version = "0.1.0"
description = "Menu bar quota meter for Claude Code and GitHub Copilot"
authors = ["Allan De Castro"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "headroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2.0.1"
tauri-plugin-shell = "2.0.2"

# HTTP + serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Credentials
keyring = "3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem paths
dirs = "5"

[features]
# Default to a release-friendly feature set
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# HTTP mocking for source adapter unit tests (see TODO.md § "Tests")
wiremock = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
